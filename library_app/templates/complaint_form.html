{% extends 'base.html' %}{% block title %}Report a concern · Campus Library{% endblock %}{% block page_context %}Submit complaint{% endblock %}
{% block content %}<div class="page-heading"><div><div class="eyebrow">SERVICE RECOVERY</div><h1>Tell us what happened</h1><p>We’ll record your concern and let you track its status.</p></div></div><section class="panel form-panel narrow-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Problem category<select class="form-select" name="category" required><option value="">Select an area</option>{% for key,label in categories.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><label>Subject<input class="form-control" name="subject" maxlength="160" required placeholder="A short summary"></label><label>Description<textarea class="form-control" name="description" rows="6" maxlength="4000" required placeholder="Include when and where this happened, and any details that may help us investigate."></textarea></label><div class="form-actions"><button class="btn btn-primary">Submit concern</button><a class="btn btn-light" href="{{ url_for('quality.my_complaints') }}">Cancel</a></div></form></section>{% endblock %}
