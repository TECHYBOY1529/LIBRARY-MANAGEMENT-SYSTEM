{% extends 'base.html' %}{% block title %}Register · Campus Library{% endblock %}
{% block auth_content %}<section class="auth-card"><div class="eyebrow">MEMBER REGISTRATION</div><h1>Create your account</h1><p class="muted">Member accounts can browse, borrow, rate services and track requests.</p>
<form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="full_name" maxlength="120" required class="form-control" autocomplete="name"></label><label>Email address<input type="email" name="email" required class="form-control" autocomplete="email"></label><label>Password <span class="field-hint">10 characters minimum</span><input type="password" name="password" minlength="10" required class="form-control" autocomplete="new-password"></label><button class="btn btn-primary btn-lg w-100" type="submit">Create member account</button></form>
<p class="auth-link">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></section>{% endblock %}
