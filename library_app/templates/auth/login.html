{% extends 'base.html' %}{% block title %}Sign in · Campus Library{% endblock %}
{% block auth_content %}<section class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Sign in to your library</h1><p class="muted">Access your books, service information and quality workspace.</p>
<form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" required autocomplete="username" class="form-control" autofocus></label><label>Password<input type="password" name="password" required autocomplete="current-password" class="form-control"></label><button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button></form>
<p class="auth-link">New to the library? <a href="{{ url_for('auth.register') }}">Create a member account</a></p></section>{% endblock %}
