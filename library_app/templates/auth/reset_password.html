{% extends 'base.html' %}{% block title %}Choose a new password · Campus Library{% endblock %}
{% block auth_content %}<section class="auth-card"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Choose a new password</h1><p class="muted">Use 10 to 256 characters. This link can only be used once.</p><form method="post" class="form-grid mt-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>New password<input class="form-control" type="password" name="password" minlength="10" maxlength="256" autocomplete="new-password" required></label><label>Confirm new password<input class="form-control" type="password" name="confirm_password" minlength="10" maxlength="256" autocomplete="new-password" required></label><button class="btn btn-primary btn-lg w-100" type="submit">Save new password</button></form></section>{% endblock %}
